<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  <script defer src="main.js"></script></head>
  <body>
    <main>
      <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
          <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
              <h1>🍔 Burger Bar</h1>
            </div>
          </div>
          <nav>
            <ul class="nav-items d-flex flex-row mb-3">
              <li>
                <a class="nav-item me-5" role="button" id="homeBtn">Home</a>
              </li>
              <li>
                <a class="nav-item me-5" role="button" id="menuBtn">Menu</a>
              </li>
              <li>
                <a class="nav-item me-5" role="button" id="bookBtn">Book</a>
              </li>
            </ul>
          </nav>
        </header>
        <div class="container" id="content">
          <div class="row">
            <div class="col">
              <h2>Book a table with us!</h2>
              <div class="mb-3">
                <label for="nameInput" class="form-label">Name</label>
                <input type="text" id="nameInput" class="form-control w-25" />
              </div>
              <div class="mb-3">
                <label for="emailInput" class="form-label">Email address</label>
                <input
                  type="email"
                  class="form-control w-25"
                  id="emailInput"
                  placeholder="name@example.com"
                />
              </div>
              <div class="mb-3">
                <label for="numberInput" class="form-label">Number of people</label>
                <select id="numberInput" class="form-select w-auto">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="reqInput" class="form-label"
                  >Additional requirements</label
                >
                <textarea
                  class="form-control w-50"
                  id="reqInput"
                ></textarea>
                <button class="btn btn-primary mt-5">Book</button>
              </div>
            </div>
          </div>
        </div>
        <footer class="pt-3 mt-4 text-body-secondary border-top">
          Made for the Odin Project | Mr-Jester-Xiii | 2026
        </footer>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
